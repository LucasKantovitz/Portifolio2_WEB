<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - Kantovitz Garage</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <a href="index.html">
        <img src="IMAGENS/logotipo.jpg" alt="Kantovitz Garage" class="logo">
    </a>

    <button id="btn-menu">☰</button>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="quem-somos.html">Quem Somos</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="contato.html">Contato</a></li>
            <li><a href="carrinho.html">🛒 Carrinho (<span id="contador-carrinho">0</span>)</a></li>
        </ul>
    </nav>

</header>


<main>

    <div class="container-contato">

        <section class="form-secao">
            <h2>Fale Conosco</h2>

            <form class="formulario" id="form-contato" novalidate>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome">

                <label for="email">E-mail</label>
                <input type="text" id="email" name="email">

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="5"></textarea>

                <p id="erro-formulario" style="color:#ff6b6b; margin-bottom:15px; display:none;"></p>
                <p id="sucesso-formulario" style="color:#4caf50; margin-bottom:15px; display:none;">Mensagem enviada com sucesso!</p>

                <button type="submit" class="btn-enviar">Enviar</button>
            </form>
        </section>

        <section class="info-secao">
            <h2>Nossos Contatos</h2>
            <p>WhatsApp: (19) 99999-9999</p>
            <p>Instagram: @kantovitzgarage</p>
            <p>E-mail: contato@kantovitzgarage.com</p>
        </section>

    </div>

</main>


<script src="js/script.js"></script>
<script src="js/contato.js"></script>

</body>
</html>
