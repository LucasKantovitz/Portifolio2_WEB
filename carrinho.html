<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrinho - Kantovitz Garage</title>

    <link rel="stylesheet" href="css/style.css">
    <style>
        .carrinho-container { max-width: 800px; margin: 50px auto; padding: 0 20px; }
        .carrinho-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2b2b2b;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
        }
        .carrinho-item .nome { color: #fff; font-weight: bold; }
        .carrinho-item .preco { color: #d32f2f; font-weight: bold; }
        .btn-remover {
            background-color: #444;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-remover:hover { background-color: #d32f2f; }
        .carrinho-total {
            text-align: right;
            font-size: 20px;
            color: #fff;
            margin-top: 20px;
            font-weight: bold;
        }
        .carrinho-vazio { text-align: center; color: #ccc; padding: 40px 0; }
    </style>
</head>

<header>

    <a href="index.html">
        <img src="IMAGENS/logotipo.jpg" alt="Kantovitz Garage" class="logo">
    </a>

    <button id="btn-menu">☰</button>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="quem-somos.html">Quem Somos</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="contato.html">Contato</a></li>
            <li><a href="carrinho.html">🛒 Carrinho (<span id="contador-carrinho">0</span>)</a></li>
        </ul>
    </nav>

</header>

<main>

    <h1 style="text-align:center; margin: 30px 0;">Meu Carrinho</h1>

    <div class="carrinho-container" id="carrinho-container">
        <!-- itens inseridos aqui via js/carrinho.js -->
    </div>

</main>

<script src="js/script.js"></script>
<script src="js/carrinho.js"></script>

</body>
</html>
